{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InsightDocs AI · Payment Failed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23a78bfa;stop-opacity:1'/%3E%3Cstop offset='100%25' style='stop-color:%237c3aed;stop-opacity:1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='0' y='0' width='64' height='64' rx='16' fill='%23020617'/%3E%3Cpath d='M32 14L50 23V41L32 50L14 41V23Z' fill='url(%23g)' stroke='%23ddd6fe' stroke-width='2'/%3E%3Cpath d='M32 50V32M32 32L50 23M32 32L14 23' stroke='%23ddd6fe' stroke-width='2'/%3E%3C/svg%3E" type="image/svg+xml">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-modern-grid {
            background-color: #020617;
            background-image:
                radial-gradient(at 0% 0%, rgba(239, 68, 68, 0.06) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.06) 0px, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }
        @keyframes scale-in {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }
        .error-icon {
            animation: scale-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                       shake 0.6s ease-in-out 1s;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="h-screen w-full overflow-hidden bg-gray-950 text-zinc-100 bg-modern-grid flex items-center justify-center">

    <div class="text-center max-w-md mx-auto px-6">
        <!-- Error Icon -->
        <div class="error-icon mx-auto mb-8 w-24 h-24 rounded-full bg-red-500/10 border-2 border-red-500/30 flex items-center justify-center">
            <i class="fa-solid fa-xmark text-red-400 text-4xl"></i>
        </div>

        <h1 class="font-display text-3xl font-bold text-white mb-3" style="animation: scale-in 0.5s ease 0.5s both;">
            Payment Failed
        </h1>
        <p class="text-zinc-400 text-sm mb-2" style="animation: scale-in 0.5s ease 0.7s both;">
            We couldn't process your payment. Don't worry — no money has been deducted.
        </p>
        <p class="text-zinc-500 text-xs mb-8" style="animation: scale-in 0.5s ease 0.9s both;">
            Please try again or contact support if the issue persists.
        </p>

        <div class="flex flex-col sm:flex-row gap-3 justify-center" style="animation: scale-in 0.5s ease 1.1s both;">
            <a href="{% url 'subscription' %}" class="inline-flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 px-6 py-3 text-sm font-bold text-white shadow-lg shadow-violet-600/20 hover:shadow-violet-600/40 hover:scale-[1.02] transition-all">
                <i class="fa-solid fa-rotate-right"></i>
                Try Again
            </a>
            <a href="{% url 'upload' %}" class="inline-flex items-center justify-center gap-2 rounded-xl border border-white/10 bg-white/5 px-6 py-3 text-sm font-medium text-zinc-300 hover:bg-white/10 transition-all">
                <i class="fa-solid fa-arrow-left"></i>
                Back to Dashboard
            </a>
        </div>
    </div>

</body>
</html>
