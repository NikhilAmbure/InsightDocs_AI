version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: insightdocs_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: insightdocs_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: